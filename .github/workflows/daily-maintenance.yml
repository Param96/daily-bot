name: Daily Repo Maintenance

on:
  schedule:
    # 03:17 UTC = 08:47 IST (Off-peak minute to avoid GitHub Actions queue delays)
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commits/pushes, just log what would happen)'
        required: false
        default: 'false'

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python tools
        run: |
          pip install --quiet \
            black \
            pip-audit \
            autoflake \
            mypy \
            pytest \
            pyyaml \
            vulture \
            radon

      - name: Install Node tools
        run: |
          npm install -g eslint prettier

      - name: Install CLI tools
        run: |
          set -euo pipefail

          # GitHub CLI (usually pre-installed on ubuntu-latest)
          type -p gh >/dev/null || (sudo apt-get update && sudo apt-get install -y gh)

          # gitleaks — secret scanner
          GITLEAKS_VERSION="8.18.4"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks
          echo "✅ gitleaks installed"

          # hadolint — Dockerfile linter
          HADOLINT_VERSION="2.12.0"
          sudo curl -sSfL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          sudo chmod +x /usr/local/bin/hadolint
          echo "✅ hadolint installed"

          # lychee — broken link checker
          LYCHEE_VERSION="0.15.1"
          curl -sSfL "https://github.com/lycheeverse/lychee/releases/download/v${LYCHEE_VERSION}/lychee-v${LYCHEE_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xz -C /usr/local/bin lychee
          echo "✅ lychee installed"

          # yq — YAML processor
          YQ_VERSION="4.44.2"
          sudo curl -sSfL -o /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64"
          sudo chmod +x /usr/local/bin/yq
          echo "✅ yq installed"

          # trivy — vulnerability scanner for containers and filesystems
          TRIVY_VERSION="0.73.0"
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | sudo tar xz -C /usr/local/bin trivy
          echo "✅ trivy installed"

          # syft — SBOM generator
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sudo sh -s -- -b /usr/local/bin
          echo "✅ syft installed"

      - name: Make scripts executable
        run: chmod +x daily-maintenance.sh modules/*.sh lib/*.sh 2>/dev/null || true

      - name: Run daily maintenance
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_USER: ${{ secrets.GH_USERNAME }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: bash daily-maintenance.sh

      - name: Commit reports (if any)
        if: always()
        run: |
          cd ${{ github.workspace }}
          git add reports/ stats/ || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily reports $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Notify on failure
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [[ -n "${WEBHOOK_URL:-}" ]]; then
            curl -sfS -H "Content-Type: application/json" \
              -d '{"content":"⚠️ Daily maintenance workflow FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}","text":"⚠️ Daily maintenance workflow FAILED. Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
              "$WEBHOOK_URL" || true
          fi
