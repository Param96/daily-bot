name: Daily Repo Maintenance

on:
  schedule:
    # 03:00 UTC = 08:30 IST. Adjust to taste.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no commits/pushes, just log what would happen)'
        required: false
        default: 'false'

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install helper tools
        run: |
          npm install -g eslint prettier
          pip install black --quiet

      - name: Install GitHub CLI
        run: |
          type -p gh >/dev/null || (sudo apt-get update && sudo apt-get install -y gh)

      - name: Run daily maintenance
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GH_USER: ${{ secrets.GH_USERNAME }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash scripts/daily-maintenance.sh
